name: Storefront checks
on:
  push:
    branches:
      - feat/flagship-storefront-2026
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run audit:lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-award-benchmark
          path: quality-reports/
          retention-days: 14
